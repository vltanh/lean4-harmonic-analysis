name = "HarmonicAnalysis"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HarmonicAnalysis", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "BanachProbability"
git = "https://github.com/vltanh/lean4-banach-probability"
rev = "89b3cc6bdbe36fcc8455026f165e8ab6563beca9"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "HarmonicAnalysis"
globs = ["HarmonicAnalysis.*"]

# The Challenge and Solution of each Palomar entry, as the modules `FourierMultipliers.Challenge`,
# `FourierMultipliers.Solution`, ... of the source directory `palomar/`.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
globs = ["FourierMultipliers.+"]
