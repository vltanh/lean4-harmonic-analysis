name = "VectorValuedHarmonicAnalysis"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["VectorValuedHarmonicAnalysis"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "BanachProbability"
path = "../lean4-banach-probability-lpp"

[[require]]
name = "HarmonicAnalysis"
path = "../lean4-harmonic-analysis"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "VectorValuedHarmonicAnalysis"
globs = ["VectorValuedHarmonicAnalysis.*"]
