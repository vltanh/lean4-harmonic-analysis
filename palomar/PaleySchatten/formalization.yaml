# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Paley's inequality and the lower Khintchine inequality in the Schatten classes, in Lean"
  description: >-
    Lean 4 proofs of two inequalities of Lust-Piquard and Pisier (1991) for matrices, in the
    Schatten norms S_p, 1 <= p <= 2, with constants that do not depend on p or on the size of the
    matrices.


    Paley's inequality (Theorem III.1 (i), for the Paley projection and S_p): there is an absolute
    constant M such that for every function f of H^1 on the circle with values in the n x n complex
    matrices, the coefficients of f at the powers of 2 are sums a_k + b_k for which the S_p norms of
    the square functions (sum a_k a_k*)^(1/2) and (sum b_k* b_k)^(1/2) add up to at most M times the
    integral of the S_p norm of f.


    The lower Khintchine inequality (Corollary III.4, and Theorem 0.1 for p = 1, with random signs;
    Pisier 1998, Theorem 8.4.1 (ii)): matrices A_1, ..., A_K are sums a_k + b_k for which the same
    sum of norms is at most M times the expectation of the S_p norm of sum eps_k A_k. The proof is
    that of Lust-Piquard and Pisier, by the Riesz factorization of H^1.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.FA", "math.OA"]
  msc2020: ["46L52", "47B10", "42A55", "42B30", "46B09", "46L53", "68V20"]

sources:
  - title: "Non commutative Khintchine and Paley inequalities"
    authors:
      - "Françoise Lust-Piquard"
      - "Gilles Pisier"
    id: "Ark. Mat. 29 (1991), 241-260"
    type: "paper"
    location: "https://doi.org/10.1007/BF02384340"
    relationship: "formalizes"
    note: >-
      Theorem III.1 (i) (pp. 252-253) for the Paley projection and S_p, 1 <= p <= 2 (for p = 1,
      Theorems 0.3 and II.1 a) (i), without the constant 1 + sqrt 2), and the left-hand inequality
      of Corollary III.4 (p. 254), with random signs instead of e^{i 2^k t} (for p = 1, the
      right-hand inequality of (0.5), Theorem 0.1), by the paper's proofs (pp. 243, 249-253); the
      departures are in fidelity.divergences.
    author_endorsement: "not-contacted"
  - title: "Non-commutative vector valued L_p-spaces and completely p-summing maps"
    authors:
      - "Gilles Pisier"
    id: "Astérisque 247 (1998)"
    type: "book"
    location: "https://www.numdam.org/item/AST_1998__247__R1_0/"
    relationship: "formalizes"
    note: >-
      Theorem 8.4.1 (ii), (8.4.4), p. 105: the left-hand inequality, for finite matrices, with the
      expectation of the S_p norm in place of the (larger) norm of L_p(S_p); the constant is
      independent of p, as there. The right-hand inequality and Gaussian variables (p. 106) are not
      formalized.
    author_endorsement: "not-contacted"
  - title: "Analysis in Banach Spaces, Volume I: Martingales and Littlewood-Paley Theory"
    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 63, Springer (2016)"
    type: "book"
    location: "https://doi.org/10.1007/978-3-319-48520-1"
    relationship: "background"
    note: >-
      Proposition 5.7.1 (transference from the line to the circle) and the dilation argument of the
      proof of Theorem 5.7.10 carry McConnell's theorem over to the circle, for (III.3).
  - title: "Vector-valued singular integrals and the H^1-BMO duality"
    authors:
      - "Jean Bourgain"
    id: "Probability theory and harmonic analysis (Cleveland, Ohio, 1983), Pure Appl. Math. 98, Dekker (1986), 1-19"
    type: "paper"
    location: "https://zbmath.org/?q=an:0602.42015"
    relationship: "background"
    note: >-
      Theorem 4, a vector-valued Marcinkiewicz multiplier theorem, is what Lust-Piquard and Pisier
      use for (III.3). Not accessible and not consulted; replaced by their second reference,
      McConnell, Theorem 1.3.
  - title: "On Fourier multiplier transformations of Banach-valued functions"
    authors:
      - "Terry R. McConnell"
    id: "Trans. Amer. Math. Soc. 285 (1984), 739-757"
    type: "paper"
    location: "https://doi.org/10.1090/s0002-9947-1984-0752501-x"
    relationship: "background"
    note: >-
      Theorem 1.3 (with Theorem 1.1), the second reference of Lust-Piquard and Pisier for (III.3),
      proved in the library along the paper, with Burkholder's theorem of 1983 on the Hilbert
      transform (the entry VectorValuedLittlewoodPaley of this repository).
  - title: "Generalized interpolation in H^infinity"
    authors:
      - "Donald Sarason"
    id: "Trans. Amer. Math. Soc. 127 (1967), 179-203"
    type: "paper"
    location: "https://doi.org/10.1090/s0002-9947-1967-0208383-8"
    relationship: "background"
    note: >-
      Theorem 4, the factorization that the proof uses, is proved in the library (the entry
      HardyFactorization of this repository). The matrix case goes back further, to Helson and
      Lowdenslager (Lust-Piquard and Pisier, p. 243): 1958, Theorem 10, for a non-singular constant
      coefficient.
  - title: "Non-commutative martingale transforms"
    authors:
      - "Narcisse Randrianantoanina"
    id: "J. Funct. Anal. 194 (2002), 181-212"
    type: "paper"
    location: "https://doi.org/10.1006/jfan.2002.3952"
    relationship: "background"
    note: >-
      The UMD property of the Schatten classes, proved in BanachProbability by this paper's theorem;
      Lust-Piquard and Pisier recall it, with Cotlar's trick as a known argument.
  - title: "Inégalités de Khintchine dans C_p (1 < p < infinity)"
    authors:
      - "Françoise Lust-Piquard"
    id: "C. R. Acad. Sci. Paris Sér. I Math. 303 (1986), 289-292"
    type: "paper"
    location: "https://zbmath.org/?q=an:0592.47038"
    relationship: "background"
    note: >-
      The original theorem for 1 < p < infinity. Not consulted; its proof is not followed.

related_formalizations:
  - id: "https://github.com/vltanh/lean4-banach-probability"
    relationship: "builds-on"
    note: >-
      Lean 4, same maintainer. The Solution uses its Schatten norms, Hölder's inequality, the UMD
      property of the Schatten classes and the contraction principle. The definition of the Schatten
      norms is restated in the Challenge and is equal by definition to the one of that package
      (complexSchattenNorm_eq in the Solution), whose entry SchattenClasses identifies the singular
      values (complexSchattenNorm_eq_singularValues); the two checks of this entry are the complex
      versions of two checks for real matrices of its entry NoncommutativeKhintchine. The two-sided
      Khintchine inequality for exponents at least 2 and real square matrices is that entry, and is
      not restated here; its upper bound is proved there by another method, with an explicit
      constant of the order of the square root of the exponent, which also follows from the
      inequality here by duality and the K-convexity of the Schatten classes (Pisier 1998, p. 106).
  - id: "https://github.com/xf-shi/Tensor_Norm"
    relationship: "independent"
    note: >-
      Lean 4. A Khintchine inequality in L^1 for Haar unitary coefficients, with the row-plus-column
      norm. Random signs and other exponents were not seen there. (Search of 22 November 2026; read
      as text, not built. No code of it is used.)
  - id: "https://github.com/tchen-research/NLAlib"
    relationship: "independent"
    note: >-
      Lean 4. The upper Khintchine bound in S_{2p}, p a natural number, for complex Hermitian
      matrices. Exponents below 2 were not seen there. (Search of 22 November 2026; read as text,
      not built. No code of it is used.)
  - id: "https://github.com/BuxinSu/LearningTheoryFormalizations"
    relationship: "independent"
    note: >-
      Lean 4. A matrix Khintchine inequality in operator norm, with a factor of the order of the
      square root of the logarithm of the dimension. (Search of 22 November 2026; read as text, not
      built. No code of it is used.)

status:
  scope: >-
    Formalized (the 4 theorems that Comparator checks), for complex square matrices of every size
    and 1 <= p <= 2: Paley's inequality for functions of H^1 on the circle, for the frequencies 2^k,
    0 <= k < K, with an absolute constant; the lower Khintchine inequality for random signs, finite
    families, with an absolute constant; two identities for Schatten norms that identify the square
    functions and the norm of S_2.


    Not formalized: the easy inequalities in the other direction (I.14), with which the two norms
    are equivalent; Theorem III.1 (ii), (iii) and the Paley projection on H^1; general H^1 - l^2
    multipliers and lacunary sequences; symmetric sequence spaces other than l^p, 1 <= p <= 2;
    infinite sums, infinite dimension and general von Neumann algebras; rectangular matrices;
    Gaussian variables; the constants (1 + sqrt 2 for p = 1). The two-sided inequality for exponents
    at least 2 (real square matrices) is in BanachProbability.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 5 hours between the first and the last commit of the vector-valued part of the
          library (22 November 2026, git log), with other work in parallel, and about 1 hour for
          the three entries of this part together, with the additions to the library that they
          needed and the review, and about 2 hours for McConnell's theorems; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib and packages
        built on it.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. Complex n x n matrices with the Schatten norms, C_E = S_p with 1 <= p <= 2, where
    the paper has symmetric sequence spaces E and operators on l^2. The constants are independent of
    n, as in the paper (by the infinite dimension), and of p, which the paper does not state; for
    the Khintchine inequality Pisier (1998) states it (Theorem 8.4.1 (ii)) and attributes it to
    Corollary III.4 (p. 106). H^1 is defined by the vanishing of the Fourier coefficients of
    negative order, where the paper has the closure of the analytic polynomials in L^1 (the two
    agree for matrices of a fixed size; not formalized). Only the frequencies 2^k, k < K (the Paley
    projection), not general H^1 - l^2 multipliers. The norm of C_p(l^2_R) + C_p(l^2_L) is bounded
    by exhibiting a decomposition, for every K, and the S_p norms of the square functions are
    written as square roots of S_{p/2} (quasi-)norms of the sums of squares. Theorem II.1 a) (i)
    without the constant 1 + sqrt 2. Corollary III.4: only the left-hand inequality; with random
    signs, as in Theorem 0.1 and in Pisier's (8.4.4), where the corollary has e^{i 2^k t}; 1 <= p <=
    2, where the corollary names C_p for 1 < p < 2 (its general form, for E 2-concave with C_{E^(2)}
    UMD, covers 1 <= p <= 2; p = 1 is also Theorem 0.1); the expectation (the L^1 norm) on the
    right-hand side, which is at most the L^2 norm of the corollary and the L_p norm of (8.4.4).


    Proofs. The paper's, with these departures, recorded in the docstrings of the modules. (III.3),
    for every choice of signs, is proved from McConnell's Theorem 1.3, the second reference of the
    paper, and not from Bourgain's multiplier theorem (Theorem 4 of his 1986 paper), which was not
    accessible; the multiplier of p. 253, whose values at the powers of 2 are sums of two signs, is
    written as a combination of dyadic multipliers with blocks closed on the left and on the right,
    carried over from the line to the circle. That
    C_{2p} is UMD, recalled in the paper with Cotlar's trick, interpolation and duality as a known
    argument, is proved in BanachProbability by Randrianantoanina's theorem. The case p = 1 is
    covered by the proof of Theorem III.1; the proof of Theorem II.1, with Parseval's identity, is
    not followed. The factorization is Sarason's Theorem 4 in finite dimension, as in the paper
    (which cites p. 204 of an article that ends on p. 203), with (beta) as an equality from the two
    identities of that theorem.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, its docstrings and this file with
    the sources (page images for the scans) and found no wrong, vacuous or weakened statement; its
    remarks on attributions, page numbers, divergences and wording were followed, and it checked the
    corrected entry again, with a few further remarks on the new text, none on a statement, which
    were followed. The sentences on (III.3) and McConnell were changed later, with the proof, and
    compared with the sources by another agent.

alignment:
  namespace: "PaleySchattenChallenge"
  statements:
    - source: "Lust-Piquard-Pisier 1991, Theorem III.1 (i) (Paley projection, S_p); p = 1: Theorems 0.3 and II.1 a) (i)"
      lean: "PaleySchattenChallenge.paley"
      module: "PaleySchatten.Challenge"
      status: "partial"
      note: >-
        Finite matrices, 1 <= p <= 2, the frequencies 2^k; a constant independent of p and of the
        size; not the constant 1 + sqrt 2 for p = 1.
    - source: "Lust-Piquard-Pisier 1991, Corollary III.4 (left-hand inequality) and Theorem 0.1; Pisier 1998, Theorem 8.4.1 (ii)"
      lean: "PaleySchattenChallenge.khintchine_lower"
      module: "PaleySchatten.Challenge"
      status: "partial"
      note: >-
        Random signs, finite matrices, the hard inequality only, with the expectation on the
        right-hand side.
    - source: "a check of the definitions"
      lean: "PaleySchattenChallenge.schatten_conjTranspose_mul_self"
      module: "PaleySchatten.Challenge"
      status: "proved"
      note: "The S_{q/2} norm of B* B is the square of the S_q norm of B."
    - source: "a check of the definitions"
      lean: "PaleySchattenChallenge.schatten_two_sq"
      module: "PaleySchatten.Challenge"
      status: "proved"
      note: "The S_2 norm is the Frobenius norm."

