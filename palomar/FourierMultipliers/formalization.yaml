        4.3.1, commit f9198d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs and compared them with the sources; this entry by one agent, with an independent
        reviewer agent. Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: "about 11 hours between the library's first and last commits (21-22 November 2026), not continuous, and about 2 hours for this entry; agent time not tracked"
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents at the request of the maintainer. No person has
    reviewed the proofs; Lean has checked them. Independent AI agents compared the statements and
    the proofs with the cited sources.

fidelity:
  divergences: >-
    HNVW. Statements: scalar symbols (X = Y = C); d = 2 in Proposition 5.7.4 and Corollary 5.7.6, with
    R^2 = C and Z^2 = Z + iZ; every d in Proposition 5.3.7 (a Euclidean space). The norm on L^p(R^d) is
    defined as a supremum over Schwartz functions and proved to be the norm of the unique bounded
    extension of T_m from Schwartz functions to L^p; HNVW extend T_m from the space L^p ∩ L^1-check,
    and their remark that a dense subspace such as the Schwartz functions gives the same extension
    (p. 401, Proposition 2.4.23) is not formalized. The norm on L^p_0(T^2) is the supremum over
    trigonometric polynomials of mean zero, as in HNVW (pp. 457-458). Proposition 5.3.7 is the
    consequence that the spaces of L^p and L^{p'} multipliers are equal isometrically, without the
    identification of the adjoint operator. Proposition 5.7.4 is printed without its first hypotheses
    (Banach spaces, 1 < p < infinity) and without the boundedness of m, which the definition of T_m
    asks for; here 1 < p < infinity is assumed, and the boundedness of m is proved when the liminf is
    finite. The sequence eps_j tends to 0 through positive numbers, and need not be decreasing.
    Corollary 5.7.6: only the inequality I <= II; m(0) is arbitrary (the book sets it to the mean of m
    over the unit circle, which matters only for III). Proofs: the book's, for Proposition 5.3.7,
    Proposition 5.7.4, Lemma 5.7.5, Proposition 2.4.23 (ii) and Corollary 5.7.6. Departures, forced
    by slips of the text: the norming of T_m f uses test functions g whose Fourier transforms converge
    in L^1 as well (the density in L^{p'} alone does not suffice); the cell in Lemma 5.7.5 is centred;
    two interchanged exponents in the last display of the proof of Proposition 5.7.4.

    Dragičević. Theorem 1.1 only for n = 2, and for every p > 1 where the paper has p > 2 (the same
    proof). The paper's T is a singular integral; here B is the Fourier multiplier with symbol
    conj(xi)/xi, the two being equal by a classical computation that is not formalized, and the proof
    uses B only through B^2(dbar^2 f) = d^2 f, as the paper's does. The paper asserts that the test
    functions belong to W^{n,p} and that this gives that identity; here it is proved by approximating
    f_{2,alpha} by Schwartz functions, and the bound by density. The derivatives of f_{2,alpha} are
    pointwise (they exist off 0 and the unit circle). The bound is for the supremum over Schwartz
    functions, in [0, infinity].

    Carbonaro, Dragičević and Kovač. Section 1.3.1 for the even powers R^{2k} = B^k, k >= 0, by its
    argument: the adjoint of B^k is B^{-k}, and B^{-k} f is the conjugate of B^k applied to the
    conjugate of f. The bounds with p* for p < 2 are not stated in Dragičević's paper; they combine
    Theorem 1.1 for p' with this equality. The strict bound by p* - 1 is arithmetic:
    kappa_2(p*) > p* - 1 for p* > 2.

