      note: "n = 2 only; for every p > 1 (the paper: p > 2)."
    - source: "Dragičević 2011, Theorem 1.1 (the bound), n = 2"
      lean: "FourierMultipliersChallenge.dragicevic_lower_bound"
      module: "FourierMultipliers.Challenge"
      status: "partial"
      note: "n = 2 only; for every p > 1 (the paper: p > 2)."
