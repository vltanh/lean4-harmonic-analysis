sources:
  - title: "Analysis in Banach Spaces, Volume I: Martingales and Littlewood-Paley Theory"
    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 63, Springer (2016)"
    type: "book"
    location: "https://doi.org/10.1007/978-3-319-48520-1"
    relationship: "formalizes"
    note: >-
      Proposition 5.3.7 (p. 403), Proposition 5.7.4 (pp. 460-462) and, in Corollary 5.7.6
      (pp. 462-463), the inequality I <= II, for scalar symbols and, in the last two, for d = 2.
      Proved by the book's arguments, which also use Lemma 5.7.5 (proved by its proof) and
      Proposition 2.4.23 (ii) (p. 118, proved by its proof, for Schwartz functions). The corrections
      to the printed text that the statements and proofs need are in fidelity.divergences.
    author_endorsement: "not-contacted"
  - title: "Some remarks on the L^p estimates for powers of the Ahlfors-Beurling operator"
    authors:
      - "Oliver Dragičević"
    id: "Arch. Math. 96 (2011), 463-471"
    type: "paper"
    location: "https://doi.org/10.1007/s00013-011-0246-1"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 for n = 2, by its proof (pp. 466-467) with the test functions of p. 465, for every
      p > 1 (the paper assumes p > 2). The theorem is for every n and every suitable cutoff g_n; only
      n = 2 and the paper's example of a cutoff are formalized. Theorem 1.4 and Proposition 1.3 are
      not formalized.
    author_endorsement: "not-contacted"
  - title: "Sharp L^p estimates of powers of the complex Riesz transform"
    authors:
      - "Andrea Carbonaro"
      - "Oliver Dragičević"
      - "Vjekoslav Kovač"
    id: "Math. Ann. 386 (2023), 1081-1125; arXiv:2109.08369v3"
    type: "paper"
    location: "https://arxiv.org/abs/2109.08369v3"
    relationship: "formalizes"
    note: >-
      Only Section 1.3.1: the norms of R^k on L^p and L^q are equal (read in arXiv v3), here for
      the even powers R^{2k} = B^k. The main results (the sharp estimates of the norms of R^k) are
      not formalized.
    author_endorsement: "not-contacted"
  - title: "Analysis of the Ahlfors-Beurling transform"
    authors:
      - "Oliver Dragičević"
    id: "arXiv:2109.04555"
    type: "other"
    location: "https://arxiv.org/abs/2109.04555"
    relationship: "background"
    note: >-
      Lecture notes (Seville, 2013). Proposition 4.2 repeats Theorem 1.1 of the 2011 paper and its
      proof. The hint of Exercise 2.19 (approximate by smooth functions) is the density step used
      for the test functions.

related_formalizations:
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "independent"
    note: >-
      Lean 4. The Beurling transform on L^p as the multiplier conj(xi)/xi, bounded through
      Mihlin-Hörmander, with B(dbar u) = d u for Schwartz u; multipliers on L^2 and their adjoints.
      No transference and no lower bound for the norms of the powers was found in it (search of
      22 November 2026). No code of it is used.
  - id: "https://github.com/will1491/no-wandering-domains"
    relationship: "independent"
    note: >-
      Lean 4 (arXiv:2609.16027). The Beurling transform as a principal value, its boundedness on
      L^p and d w = B(dbar w), through the Carleson project's Calderón-Zygmund theory. No code of it
      is used.
  - id: "https://github.com/openai/math"
    relationship: "independent"
    note: "Lean 4. The Beurling transform as an isometric multiplier of L^2. No code of it is used."
  - id: "https://github.com/Tencent-Hunyuan/Hyra-results"
    relationship: "independent"
    note: >-
      Lean 4, for a claimed upper bound for the norm of the Beurling transform: the operator on L^2
      and numerical certificates. No code of it is used.
  - id: "https://github.com/facebookresearch/atlas-lean"
    relationship: "independent"
    note: >-
      Lean 4. States, without proof, Lehto's lower bound p* - 1 for the norm of the Beurling transform
      and Iwaniec's conjecture. No code of it is used.

status:
  scope: >-
    Formalized (the 11 theorems that Comparator checks): what multiplierNorm is (the norm of the
    unique bounded extension of T_m from Schwartz functions to L^p, for bounded measurable m and
    1 <= p < infinity); duality on a Euclidean space; transference from T^2 to R^2 for scalar symbols
    continuous off 0, and for those that are homogeneous of degree 0; B^k(dbar^k F) = d^k F for
    Schwartz F, also for the k-fold iterate of B; the equality of the norms of B^k on L^p and L^{p'};
    the closed form of kappa_2(p); Dragičević's limit and lower bound for n = 2, the bound with p* for
    all 1 < p < infinity, and its consequence ||B^2||_p > p* - 1.

    Not formalized: operator-valued symbols and other dimensions in the transference; the equality
    of the three norms in HNVW's Corollary 5.7.6 (the inequalities II <= III <= I); Dragičević's bound
    for n != 2, and other cutoffs; that B is bounded on L^p (so the norms are in [0, infinity], and the
    lower bounds hold there); that B is the singular integral with kernel -1/(pi z^2); that B^k, the
    multiplier with symbol (conj(xi)/xi)^k, is the k-th power of B as an operator on L^p (only on
    the functions dbar^k F, F Schwartz); that T_m extended from Schwartz functions agrees with T_m on
    the larger space L^p ∩ L^1-check of HNVW (their p. 401); that mean-zero trigonometric polynomials
    are dense in L^p_0.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

