    The AI system wrote the code and the documents at the request of the maintainer. No person has
    reviewed the proofs; Lean has checked them. Independent AI agents compared the statements and
    the proofs with the cited sources.

fidelity:
  divergences: >-
    HNVW. Statements: scalar symbols (X = Y = C), functions defined everywhere (bounded and Borel in
    Proposition 5.3.7), where the book has classes in L^infinity; d = 2 in Proposition 5.7.4 and
    Corollary 5.7.6, with R^2 = C and Z^2 = Z + iZ; every d in Proposition 5.3.7 (a Euclidean space).
    The norm on L^p(R^d) is
    defined as a supremum over Schwartz functions and proved to be the norm of the unique bounded
    extension of T_m from Schwartz functions to L^p; HNVW extend T_m from the space L^p ∩ L^1-check,
    and their remark that a dense subspace such as the Schwartz functions gives the same extension
    (p. 401, Proposition 2.4.23) is not formalized. The norm on L^p_0(T^2) is the supremum over
    trigonometric polynomials of mean zero, by which HNVW define multipliers (pp. 457-458); that it is
    the norm of the extension to L^p_0 (density) is not formalized, and the supremum is in any case at
    most that norm. Of Proposition 5.3.7, the last assertion (the spaces of L^p and L^{p'} multipliers
    are equal isometrically), without the identification of the adjoint operator. Proposition 5.7.4 is
    printed without its first hypotheses (Banach spaces, 1 < p < infinity) and without the boundedness
    of m, which the definition of T_m asks for; here 1 < p < infinity is assumed, and the boundedness
    of m is proved when the liminf is finite. The sequence eps_j tends to 0 through positive numbers,
    and need not be decreasing. Corollary 5.7.6 (which does not state 1 < p < infinity either): only
    the inequality I <= II; m(0) is arbitrary (the book sets it to the mean of m over the unit circle,
    which matters only for III). Proofs: the book's, for Proposition 5.3.7, Proposition 5.7.4, Lemma
    5.7.5, Proposition 2.4.23 (ii) and Corollary 5.7.6. Departures that slips of the text force: the
    norming of T_m f uses test functions g whose Fourier transforms converge in L^1 as well (the
    density in L^{p'} alone does not suffice); the cell in Lemma 5.7.5 is centred; two interchanged
    exponents in the last display of the proof of Proposition 5.7.4. Other differences of detail,
    recorded in the docstrings of the modules: in Proposition 5.7.4 the limit is taken in the pairing
    before duality, not in L^p after it; in Proposition 2.4.23 (ii), for Schwartz functions, the
    preliminary truncation is not needed; in Lemma 5.7.5 the tail of the periodisation is summed
    pointwise before the norm is taken.

    Dragičević. Theorem 1.1 only for n = 2, and for the cutoff g_2 that the paper gives as an example
    (there, any sufficiently smooth, rapidly decaying g_n equal to 1 on [0, 1]); for every p > 1 where
    the paper has p > 2 (the same proof; for p <= 2, kappa_2(p) <= 1 and the bound says little, the one
    with p* being the informative one). The paper's T is a singular integral; here B is the Fourier
    multiplier with symbol conj(xi)/xi, the two being equal by a classical computation that is not
    formalized, and B^n is the multiplier with the n-th power of the symbol, where the paper has the
    n-th power of T. The proof uses B^2 through B^2(dbar^2 F) = d^2 F, proved for Schwartz functions F.
    The paper asserts that the test functions belong to W^{n,p}, which gives that identity for them.
    Neither is proved here; what is used, ||d^2 f_{2,alpha}||_p <= ||B^2||_p ||dbar^2 f_{2,alpha}||_p,
    is proved by approximating f_{2,alpha} by Schwartz functions phi_k with dbar^2 phi_k ->
    dbar^2 f_{2,alpha} and d^2 phi_k -> d^2 f_{2,alpha} in L^p, and the identity for the phi_k. The
    derivatives of f_{2,alpha} are pointwise (they exist off 0 and the unit circle); that they are
    almost everywhere the weak ones is not formalized. The bound is for the supremum over Schwartz
    functions, in [0, infinity].

    Carbonaro, Dragičević and Kovač. Section 1.3.1 (a standard reduction in the paper, for all powers
    R^k, k an integer) for the even powers R^{2k} = B^k, k >= 0, by its argument: the adjoint of B^k is
    B^{-k}, and B^{-k} f is the conjugate of B^k applied to the conjugate of f. The bounds with p* for
    p < 2 are not stated in Dragičević's paper; they combine
    Theorem 1.1 for p' with this equality. The strict bound by p* - 1 is arithmetic:
    kappa_2(p*) > p* - 1 for p* > 2.

