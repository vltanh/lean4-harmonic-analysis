      module: "FourierMultipliers.Challenge"
      status: "proved"
      note: "multiplierNorm m p is the norm of the unique bounded extension of T_m to L^p, which exists if and only if it is finite."
    - source: "HNVW, Proposition 5.3.7 (scalar symbols)"
      lean: "FourierMultipliersChallenge.multiplierNorm_conjExponent"
      module: "FourierMultipliers.Challenge"
      status: "proved"
      note: "The norms of T_m on L^p and L^{p'} are equal, for bounded measurable m on a Euclidean space."
    - source: "HNVW, Proposition 5.7.4 (scalar symbols, d = 2)"
      lean: "FourierMultipliersChallenge.transference"
      module: "FourierMultipliers.Challenge"
      status: "proved"
      note: "With the boundedness of m, when the liminf is finite, as a conclusion."
    - source: "HNVW, Corollary 5.7.6, I <= II (scalar symbols, d = 2)"
      lean: "FourierMultipliersChallenge.transference_homogeneous"
      module: "FourierMultipliers.Challenge"
      status: "partial"
      note: "One of the inequalities between the three norms, which the corollary says are equal."
    - source: "Dragičević 2011, p. 465 (T^n(dbar^n f) = d^n f)"
      lean: "FourierMultipliersChallenge.beurlingPow_dzbar_iterate"
      module: "FourierMultipliers.Challenge"
      status: "proved"
      note: "For Schwartz functions; the paper states it for functions of W^{n,p}."
    - source: "Carbonaro-Dragičević-Kovač, Section 1.3.1"
      lean: "FourierMultipliersChallenge.beurlingPowNorm_conjExponent"
      module: "FourierMultipliers.Challenge"
      status: "proved"
      note: "For the even powers R^{2k} = B^k of the complex Riesz transform R."
    - source: "Dragičević 2011, definition of kappa_n(p), n = 2"
      lean: "FourierMultipliersChallenge.beurlingKappa_two"
      module: "FourierMultipliers.Challenge"
      status: "proved"
