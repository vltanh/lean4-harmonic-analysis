# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Fourier multipliers on L^p in Lean: transference, and powers of the Beurling-Ahlfors transform"
  description: >-
    Lean 4 proofs, from Mathlib alone, of results on the norms of scalar Fourier multipliers T_m on
    L^p, 1 < p < infinity.


    Transference from the torus to the plane (Hytönen, van Neerven, Veraar and Weis, "Analysis in
    Banach Spaces I", Proposition 5.7.4 and the inequality I <= II of Corollary 5.7.6, for scalar
    symbols in dimension 2): if m is continuous off 0 and eps_j decreases to 0, the norm of T_m on
    L^p(R^2) is at most the liminf of the norms of the multipliers (m(eps_j k))_{k != 0} on the
    mean-zero functions of L^p(T^2); for m homogeneous of degree 0, it is at most the norm of
    (m(k))_{k != 0}. Duality on a Euclidean space (Proposition 5.3.7, for scalar symbols): the norms
    of T_m on L^p and on L^{p'} are equal. The norms on a Euclidean space are suprema over Schwartz
    functions, and it is proved that, for bounded measurable m, they are the norms of the bounded
    extensions of T_m to L^p. Those on the torus are suprema over mean-zero trigonometric polynomials.


    Lower bounds for the square of the Beurling-Ahlfors transform B (Dragičević 2011, Theorem 1.1,
    for n = 2): ||B^2||_p >= kappa_2(p) = (p - 1)(2p - 1)/(p + 1), with the limit of the ratios for
    his test functions, from which it follows; with p* = max(p, p') and the equality of the norms of
    B^k on L^p and L^{p'}, as in Carbonaro, Dragičević and Kovač (2023), ||B^2||_p >= kappa_2(p*), and
    ||B^2||_p > p* - 1 for p != 2. B is the multiplier with symbol conj(xi)/xi, and B^k(dbar^k F) =
    d^k F is proved for Schwartz functions F.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

