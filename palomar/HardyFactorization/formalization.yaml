# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Szegő's theorem and the Riesz factorization for matrix-valued functions, in Lean"
  description: >-
    Lean 4 proofs of theorems on matrix-valued functions on the circle, of Helson and Lowdenslager
    (1958, 1961) and Sarason (1967).


    Szegő's theorem for a positive semidefinite W with integrable entries (1958, Theorem 8, for
    absolutely continuous measures): exp((1/n) int log det W) is the infimum of int (1/n) tr(Q* W Q)
    over the analytic polynomials Q whose constant coefficient has determinant 1, and the infimum is
    0 if log det W is not integrable. The factorization W = B* B with B in H^2, det B^(0) != 0,
    exists exactly if int log det W > -infinity, and then with B outer (Theorem 9).


    Outer functions and range functions (1961): the outer factor of A in H^2 of any shape, the range
    of an outer function (Theorem 9), the closure of A Q (Theorem 10), the criterion int log |det A|
    = log |det A^(0)| (Theorem 8), analytic range functions as ranges of left-outer isometries
    (Theorem 12), and the factorization of positive functions of any rank (Theorem 13).


    Riesz factorization (Sarason, Theorem 4, for matrices): every A in H^1 is A_1 A_2 with A_1, A_2
    in H^2, A_2* A_2 = (A* A)^(1/2) and A_1* A_1 = A_2 A_2*, so that the squares of the S_{2p} norms
    of A_1 and A_2 are the S_p norm of A, at almost every point and for every p > 0.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.FA", "math.CV"]
  msc2020: ["47A68", "30H10", "47A56", "42B30", "60G25", "15A23", "68V20"]

sources:
  - title: "Prediction theory and Fourier series in several variables"
    authors:
      - "Henry Helson"
      - "David Lowdenslager"
    id: "Acta Math. 99 (1958), 165-202"
    type: "paper"
    location: "https://doi.org/10.1007/bf02392425"
    relationship: "formalizes"
    note: >-
      Theorem 2 with its corollary (pp. 175-176, for the circle), Theorem 8 (pp. 186-193, for
      absolutely continuous measures) and Theorem 9 (pp. 193-194). Proved by the paper's arguments:
      Lemma 5 and (58), (59), Lemma 6, (68), (76), Fejér means; of Theorem 1 only (23), p. 174. The
      departures are in fidelity.divergences. Theorem 10 (pp. 195-196: a function F of H^1 with a
      non-singular constant coefficient is a product of functions of H^2) is a case of Sarason's
      Theorem 4, by which it is proved here, not by the paper's proof; that the condition on the
      coefficient can be dropped, which the paper leaves open, is due to Sarason, whose proof ends
      along the lines of this one (his p. 200).
    author_endorsement: "not-contacted"
  - title: "Prediction theory and Fourier series in several variables. II"
    authors:
      - "Henry Helson"
      - "David Lowdenslager"
    id: "Acta Math. 106 (1961), 175-213"
    type: "paper"
    location: "https://doi.org/10.1007/BF02545786"
    relationship: "formalizes"
    note: >-
      Sections 9-11: the outer factor (pp. 202-203 and 207), Theorems 8, 9, 10 (pp. 204-205), 12
      (pp. 207-208) and 13 (p. 209), by the paper's proofs; the departures are in
      fidelity.divergences. Not formalized: the corollary of Theorem 10, Theorems 11 and 14-17, and
      Sections 1-8.
    author_endorsement: "not-contacted"
  - title: "Generalized interpolation in H^infinity"
    authors:
      - "Donald Sarason"
    id: "Trans. Amer. Math. Soc. 127 (1967), 179-203"
    type: "paper"
    location: "https://doi.org/10.1090/s0002-9947-1967-0208383-8"
    relationship: "formalizes"
    note: >-
      Theorem 4 (Section 10, pp. 198-201) in finite dimension, by its proof (Lemmas 10.1, 10.3, 10.4
      and the completion of the proof); Lemmas 10.2 and 10.5, for infinite dimension, are not
      needed. The norm equalities are a consequence that the paper does not state.
    author_endorsement: "not-contacted"
  - title: "Lectures on invariant subspaces"
    authors:
      - "Henry Helson"
    id: "Academic Press (1964)"
    type: "book"
    relationship: "background"
    note: >-
      Cited by Sarason for Lemmas 10.1 and 10.3. Not accessible and not consulted: Lemma 10.1 is, in
      finite dimension and for B* B in place of A A*, Theorem 13 of Helson and Lowdenslager (1961),
      and Lemma 10.3 is proved from Sections 9 and 10 of that paper.
  - title: "Banach spaces of analytic functions"
    authors:
      - "Kenneth Hoffman"
    id: "Prentice-Hall (1962)"
    type: "book"
    relationship: "background"
    note: >-
      Cited by Sarason for Szegő's theorem (an outer function of given modulus) and for the quotient
      of a function by an outer function. Not accessible and not consulted: the first is Theorem 9
      of Helson and Lowdenslager (1958), and the second is proved by the argument at the end of the
      proof of Theorem 4.
  - title: "On the factorization of matrices"
    authors:
      - "Norbert Wiener"
    id: "Comment. Math. Helv. 29 (1955), 97-111"
    type: "paper"
    location: "https://doi.org/10.1007/bf02564273"
    relationship: "background"
    note: >-
      The origin of Theorem 9 of Helson and Lowdenslager (1958), according to them (p. 194). Not
      consulted; the proof is theirs.
  - title: "The prediction theory of multivariate stochastic processes, I: The regularity condition; II: The linear predictor"
    authors:
      - "Norbert Wiener"
      - "Pesi Masani"
    id: "Acta Math. 98 (1957), 111-150; 99 (1958), 93-137"
    type: "paper"
    location: "https://doi.org/10.1007/BF02404472"
    relationship: "background"
    note: >-
      A complete exposition of the results of Section 9 of Helson and Lowdenslager (1961), according
      to them (p. 198); left-outer functions are its optimal factors (p. 207). Not consulted; the
      proofs here follow Helson and Lowdenslager, with the steps that they leave out
      (fidelity.divergences).

