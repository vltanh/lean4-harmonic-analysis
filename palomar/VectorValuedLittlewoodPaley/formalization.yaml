# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Littlewood-Paley theory for functions with values in UMD spaces, in Lean"
  description: >-
    Lean 4 proofs of results of vector-valued harmonic analysis from Hytönen, van Neerven, Veraar
    and Weis, "Analysis in Banach Spaces I", and from McConnell (1984), for functions with values in
    a UMD Banach space X with UMD_p constant beta (real signs), 1 < p < infinity, with constants
    explicit in beta.


    The Hilbert transform (Theorem 5.1.13, Proposition 5.2.2): the truncated Hilbert transforms
    H_{eps, 2^n eps} are bounded on L^p(R; X) by 4 beta^2 + 11, uniformly; for f = F^{-1} G with G
    integrable, H_{eps,R} f converges pointwise to the Fourier multiplier with symbol -i sgn, which
    satisfies the same bound if f is in L^p.


    The right-hand Littlewood-Paley inequalities with sharp cut-offs and random signs, for finite
    sums, with the constant (144 beta + 1)(4 beta^2 + 11): on the line (Corollary 5.3.25), for the
    dyadic intervals and their dilates, and on the circle (Theorem 5.7.10 (2)), for the dyadic
    blocks and trigonometric polynomials. Transference (Proposition 5.7.1, d = 1): a bounded
    operator-valued Fourier multiplier on the line, continuous at the integers, restricts to a
    multiplier on the circle whose norm is not larger.


    McConnell's theorems in dimension 1: a multiplier m of class C^2 on R minus 0 with
    |xi|^k |m^(k)(xi)| <= c, k <= 2, is bounded by C c beta^2 (Theorem 1.1, Mihlin's theorem), and
    the Littlewood-Paley inequalities with sharp cut-offs hold, in both directions, for every choice
    of the signs of the dyadic intervals (Theorem 1.3, the implication from UMD).
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.FA", "math.CA"]
  msc2020: ["42B25", "42A45", "42A50", "46E40", "46B09", "60G46", "68V20"]

sources:
  - title: "Analysis in Banach Spaces, Volume I: Martingales and Littlewood-Paley Theory"
    authors:
      - "Tuomas Hytönen"
      - "Jan van Neerven"
      - "Mark Veraar"
      - "Lutz Weis"
    id: "Ergebnisse der Mathematik und ihrer Grenzgebiete (3) 63, Springer (2016)"
    type: "book"
    location: "https://doi.org/10.1007/978-3-319-48520-1"
    relationship: "formalizes"
    note: >-
      Theorem 5.1.13 (pp. 385-386, the bound, for the truncations R = 2^n eps and for the limit on
      the functions F^{-1} G in L^p, G integrable), Proposition 5.2.2 (p. 389), Corollary 5.3.25
      (pp. 419-420, right-hand inequality, finite sums, with dilations), Proposition 5.7.1 (pp.
      458-460, d = 1), Theorem 5.7.10 (2) (pp. 465-466, right-hand inequality). Proved along the
      book's arguments (Sections 5.1 to 5.3 and 5.7), which also use Propositions 5.1.4, 5.1.5 and
      5.1.10, Lemmas 5.1.9, 5.2.1, 5.3.9 and 5.3.21 to 5.3.23, Proposition 5.3.10, Lemmas 5.7.2 and
      5.7.3, and Propositions 1.2.22, 1.3.1, 3.2.10 and 4.2.3 and Lemma 2.4.8; the departures are in
      fidelity.divergences. The case of Hilbert spaces uses Corollary 4.5.15 (pp. 346-347), whose
      statement on UMD constants is proved in BanachProbability (real signs).
    author_endorsement: "not-contacted"
  - title: "On Fourier multiplier transformations of Banach-valued functions"
    authors:
      - "Terry R. McConnell"
    id: "Trans. Amer. Math. Soc. 285 (1984), 739-757"
    type: "paper"
    location: "https://doi.org/10.1090/s0002-9947-1984-0752501-x"
    relationship: "formalizes"
    note: >-
      Theorem 1.1 (pp. 741, 746-751) and Theorem 1.3 (pp. 742, 754-756, the implication from UMD
      spaces to the inequalities (1.13)), for n = 1, by the paper's proofs, with (2.1), Lemmas 2.1
      to 2.3, 3.1 and 3.2; the departures are in fidelity.divergences. With Bourgain, the origin of
      the multiplier theorem (scalar symbols) and of the Littlewood-Paley inequality for UMD spaces
      (Hytönen, van Neerven, Veraar and Weis, p. 479).
    author_endorsement: "not-contacted"
  - title: "Vector-valued singular integrals and the H^1-BMO duality"
    authors:
      - "Jean Bourgain"
    id: "Probability theory and harmonic analysis (Cleveland, Ohio, 1983), Pure Appl. Math. 98, Dekker (1986), 1-19"
    type: "paper"
    location: "https://zbmath.org/?q=an:0602.42015"
    relationship: "background"
    note: >-
      With McConnell (1984) and by a different method, the origin of the Littlewood-Paley inequality
      for UMD spaces (with another article of his, of 1984), as reported by Hytönen, van Neerven,
      Veraar and Weis (p. 479), whose treatment derives from it. Not accessible and not consulted;
      the proofs follow their book and McConnell's paper.
  - title: "On L_p multipliers"
    authors:
      - "Karel de Leeuw"
    id: "Ann. of Math. (2) 81 (1965), 364-379"
    type: "paper"
    location: "https://doi.org/10.2307/1970621"
    relationship: "background"
    note: "The origin of the transference from the line to the circle (scalar multipliers)."

