status:
  scope: >-
    Formalized (the 10 theorems that Comparator checks): the uniform bound of the truncated Hilbert
    transforms H_{eps, 2^n eps} on L^p(R; X); the pointwise convergence of H_{eps,R} f to the
    Fourier multiplier -i sgn for f = F^{-1} G, G integrable; the bound of that multiplier on these
    f in L^p, for UMD spaces and, with the constant p* - 1, for Hilbert spaces; the right-hand
    Littlewood-Paley inequality on the line for finitely many dyadic intervals, their dilates and
    the interval around 0, and on the circle for the dyadic blocks; transference from the line to
    the circle for operator-valued symbols continuous at the integers; Mihlin multipliers in one
    dimension and the Littlewood-Paley inequalities on the line, in both directions, for every choice
    of the signs of the dyadic intervals; a description of the norm of Rademacher sums.


    Not formalized: the left-hand Littlewood-Paley inequalities with random signs; the existence of
    the limits of the truncated Hilbert transforms in L^p and almost everywhere for all f in L^p,
    and the extension of the multipliers from the functions F^{-1} G in L^p to all of L^p (density);
    infinite sums of random signs; Mihlin's theorem with first derivatives (Theorem 5.3.18) and
    Theorem 5.7.10 (1) (operator-valued coefficients); McConnell's Theorem 1.2; dimensions d > 1;
    integers that are only Lebesgue points in the transference; complex Rademacher variables; the
    constants of the book; the converse (the bounds imply that X is a UMD space).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.330 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, version
        4.3.2, commit 8e884d5); Claude Code sessions and sub-agents that wrote the statements and
        the proofs of the library and compared them with the sources; the number of agents was not
        tracked for this library alone. This entry by one agent, with an independent reviewer agent.
        Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: >-
          about 5 hours between the first and the last commit of the vector-valued part of the
          library (22 November 2026, git log), with other work in parallel, and about 1 hour for
          the three entries of this part together, with the additions to the library that they
          needed and the review, and about 2 hours for McConnell's theorems; agent time not tracked
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM) and API"
      prompting_notes: >-
        Instructions: state the theorems of the cited sources in their general form as far as
        feasible, follow the sources' proofs, record every deviation, use only Mathlib and packages
        built on it.
  spend_usd: "not tracked"
  notes: >-
    The AI system wrote the code and the documents. No person has reviewed the statements or the
    proofs; Lean has checked the proofs. Independent AI agents compared the proofs of the library
    with the cited sources, and one compared the statements of this entry with them.

fidelity:
  divergences: >-
    Statements. UMD constants are for real predictable signs +-1, martingales started at 0 and
    probability spaces in the universe Type; the book's beta_{p,X} has deterministic scalars of
    modulus 1 and sigma-finite measure spaces, and its beta^R_{p,X} (p. 285) real signs (predictable
    and deterministic signs give the same constants by its Theorem 4.2.25, and dyadic martingales on
    [0, 1) suffice by its Corollary 4.2.6; the first is proved in BanachProbability). The Rademacher
    variables are real signs, also for complex spaces, where the book has complex ones; by the
    contraction principle this changes the norms by at most a constant factor (not formalized). The
    functions on the line are f = F^{-1} G in L^p with G integrable (the book's L^p with the space
    L^1-check, on which it defines multipliers), not all of L^p. Theorem 5.1.13: the uniform bound
    of the truncations with R = 2^n eps on L^p, and the bound of the limit on these f; the
    convergence in L^p and almost everywhere, and the formula for Hf as an integral of convolutions,
    are not stated. Proposition 5.2.2: the pointwise limit; that Hf is in L^1-check is contained in
    the formula. Corollary 5.3.25: only the right-hand inequality, for finite sums, with all
    dilations of the intervals, which gives the finite sums of Theorem 5.3.24 by dropping terms.
    Proposition 5.7.1: d = 1; m is bounded everywhere and each m(.)x is almost everywhere strongly
    measurable, where the book has m in L^infinity; the integers are points of continuity of m(.)x,
    not only Lebesgue points; the multiplier bound on the line is assumed for Schwartz functions
    only, and C may be infinite. Theorem 5.7.10: only part (2), right-hand inequality; since f is a
    trigonometric polynomial, the finite sums contain the sum over all k. The constants are 4 beta^2
    + 11 in place of 2 beta^+ beta^-, and (144 beta + 1)(4 beta^2 + 11) in place of 40 hbar beta
    (hbar the norm of the Hilbert transform). McConnell: n = 1; UMD spaces, where the paper has
    zeta-convex spaces (by Burkholder the same class); complex spaces, with complex m of class C^2
    on R minus 0, where the paper has real m of class C^2 on R and applies the theorem on p. 755 to
    functions that are not continuous at 0; f = F^{-1} G with G integrable, in place of test
    functions with values in finite-dimensional subspaces, and no extension to L^p by density; the
    constants are C c beta^2 and C beta^8 (4 beta^2 + 11)^2 with absolute C, where the paper only
    says on what they depend; in Theorem 1.3 the dyadic intervals are those of p. 755, on both
    half-lines (p. 741 speaks of all dyadic rectangles), both inequalities of (1.13), and not the
    converse (that the inequalities imply UMD). The Hilbert space case is not stated in the book in
    this form: it is the bound with the UMD constant p* - 1 of a nonzero Hilbert space (Corollary
    4.5.15, Burkholder's theorem).


    Proofs. The book's, with these departures, recorded in the docstrings of the modules.
    Propositions 5.1.4 and 5.1.5: finitely many generations, and the randomised UMD property applied
    directly to the dyadic martingale on each unit interval (and, for the left half of 5.1.5, to the
    martingale of the shifts) instead of Theorem 4.2.13 and the equality of laws. Lemma 5.1.9: the
    random dyadic systems are translates of the standard one. Theorem 5.1.13: no limit of the
    averaged shifts in L^p (Lemmas 5.1.8, 5.1.12); the bounds are uniform in the truncation, and the
    limit is taken on the Fourier side with Fatou's lemma. Lemma 5.3.21: only for scalar weights
    equal up to dilation, with the L^1 norm of the derivative in place of the Mihlin norm; real
    signs, so that the contraction principle costs a factor 2. Lemma 5.3.23: the derivative is
    bounded by pi^2 where the book has 2 pi. Corollary 5.3.25: the signs of the intervals are
    separated first, by reflection, and the dilates come from the dilation invariance of the L^p
    norm; the book deduces it from Theorem 5.3.24. Proposition 5.7.1: continuity at the integers.
    Minkowski's integral inequality (Proposition 1.2.22) by a weighted Jensen inequality. The work
    of Bourgain (1986), from which the theory also comes, was not accessible; the book's proofs,
    which are self-contained, replace it.


    McConnell's theorems: the paper's proofs, with these departures, recorded in the docstrings. The
    process X(y), the place where a Brownian motion first hits the height y, is represented by its
    finite-dimensional distributions, chains with independent Cauchy increments, which are all that
    the proof uses; the identities (2.3) to (2.6) become a reversal of these chains. Poisson
    integrals are defined by their Fourier transforms, and (3.4) is proved on the Fourier side.
    Lemma 3.1 for n = 1 without separating the cases |s| < y and |s| >= y. The reduction to smooth m
    by mollification is not needed. The error estimate (3.6), sketched in the paper with a mean
    value theorem that fails for vector-valued functions, is made after the integration in s.
    Burkholder's inequality (2.1) is stated for deterministic coefficients, which is how it is used,
    and for complex ones by real and imaginary parts (the coefficients of the paper are complex
    unless m is even). In Theorem 1.3 the sums m_i and M are cut to finite parts and the limit is
    taken at the end. Corrections to the paper: the limit of g_N (pp. 747, 748); the height from
    which the chain starts on p. 751; (3.19), which is an inequality in both directions and not an
    equality; the function phi must be 1 near 3/2, not only at 3/2.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (independent agents)"
  notes: >-
    No human review. Independent AI agents compared the proofs of the library with the cited
    sources. Another one compared the statements of this entry, its docstrings and this file with
    the sources (page images for the scans) and found no wrong, vacuous or weakened statement; its
    remarks on attributions, page numbers, divergences and wording were followed, and it checked the
    corrected entry again, with a few further remarks on the new text, none on a statement, which
    were followed.

alignment:
  namespace: "VectorValuedLittlewoodPaleyChallenge"
  statements:
    - source: "HNVW I, Theorem 5.1.13 (truncations)"
      lean: "VectorValuedLittlewoodPaleyChallenge.truncatedHilbert_bounded"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        The uniform bound of the truncations with R = 2^n eps, with another constant; the limit in
        L^p and almost everywhere is not stated.
    - source: "HNVW I, Proposition 5.2.2"
      lean: "VectorValuedLittlewoodPaleyChallenge.hilbert_multiplier"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "proved"
      note: >-
        For every complex Banach space; the Hilbert transform as a pointwise limit and as the
        multiplier -i sgn.
    - source: "HNVW I, Theorem 5.1.13 with Proposition 5.2.2"
      lean: "VectorValuedLittlewoodPaleyChallenge.hilbert_bounded"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        On the functions F^{-1} G in L^p, G integrable, with the constant 4 beta^2 + 11.
    - source: "HNVW I, Corollary 5.3.25 (right-hand inequality)"
      lean: "VectorValuedLittlewoodPaleyChallenge.littlewoodPaley_line"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        Finite sums, real signs, another constant; for all dilates of the intervals, which gives the
        finite sums of Theorem 5.3.24.
    - source: "HNVW I, Theorem 5.7.10 (2) (right-hand inequality)"
      lean: "VectorValuedLittlewoodPaleyChallenge.littlewoodPaley_circle"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: "Real signs, another constant; not the left-hand inequality."
    - source: "HNVW I, Proposition 5.7.1 (d = 1)"
      lean: "VectorValuedLittlewoodPaleyChallenge.transference"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        d = 1; the integers are points of continuity instead of Lebesgue points. The multiplier
        bound on the line is assumed on Schwartz functions only.
    - source: "HNVW I, Theorem 5.1.13 with Corollary 4.5.15"
      lean: "VectorValuedLittlewoodPaleyChallenge.hilbert_bounded_innerProductSpace"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "adapted"
      note: "The case of a complex Hilbert space, where UMD constants do not occur in the statement."
    - source: "McConnell 1984, Theorem 1.1 (n = 1)"
      lean: "VectorValuedLittlewoodPaleyChallenge.mihlin_multiplier"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        n = 1; complex m, of class C^2 on R minus 0; on the functions F^{-1} G, G integrable, with
        the constant C c beta^2, C absolute.
    - source: "McConnell 1984, Theorem 1.3 (n = 1, UMD implies (1.13))"
      lean: "VectorValuedLittlewoodPaleyChallenge.littlewoodPaley_signs"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "partial"
      note: >-
        Both inequalities, for every choice of the signs on both half-lines; not the converse.
    - source: "a check of the definitions"
      lean: "VectorValuedLittlewoodPaleyChallenge.eLpNormRad_rpow"
      module: "VectorValuedLittlewoodPaley.Challenge"
      status: "proved"
      note: "The p-th power of the norm of a Rademacher sum is the average over the signs."

