name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # The audit sees a module's proofs only through its own `import all` line: every module of
      # HarmonicAnalysis/, and the Solution of every Palomar entry in palomar/, but no Challenge
      # (it holds a copy of the definitions).
      - name: Check that the audit imports every module of the library and every Solution
        run: >-
          diff <({ find HarmonicAnalysis -name '*.lean'; cd palomar && find . -name Solution.lean; }
          | sed 's#^\./##; s/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^import all ' scripts/Audit.lean | sed 's/^import all //' | sort)
      # Fails on any `sorry` and on any axiom beyond propext, Classical.choice, Quot.sound.
      - name: Audit axioms
        run: lake env lean scripts/Audit.lean
      - name: Check that the root module imports every module of the library
        run: >-
          diff <(find HarmonicAnalysis -name '*.lean'
          | sed 's/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^public import HarmonicAnalysis\.' HarmonicAnalysis.lean
          | sed 's/^public import //' | sort)
      # The copies of blocks of the modules of definitions (HarmonicAnalysis/Defs.lean,
      # VectorValued/Defs.lean, Hardy/Defs.lean) in the Challenges.
      - name: Check that the Challenges' copies of the definitions are current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documents' links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: python3 scripts/check_md_tables.py README.md docs/SHORTER_PROOFS.md docs/REFERENCES.md
      - name: Check that no line exceeds 100 characters
        shell: python3 {0}
        run: |
          import glob, sys
          files = ["HarmonicAnalysis.lean", *glob.glob("HarmonicAnalysis/**/*.lean", recursive=True),
                   *glob.glob("palomar/**/*.lean", recursive=True), *glob.glob("scripts/*.lean")]
          long = [f"{f}:{i}" for f in files
                  for i, line in enumerate(open(f, encoding="utf-8").read().split("\n"), 1)
                  if len(line) > 100]
          print("\n".join(long))
          sys.exit(1 if long else 0)
