name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # The audit sees a module's proofs only through its own `import all` line.
      - name: Check that the audit imports every module of the library
        run: >-
          diff <(find VectorValuedHarmonicAnalysis -name '*.lean'
          | sed 's/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^import all VectorValuedHarmonicAnalysis\.' scripts/Audit.lean
          | sed 's/^import all //' | sort)
      - name: Check that the root module imports every module of the library
        run: >-
          diff <(find VectorValuedHarmonicAnalysis -name '*.lean'
          | sed 's/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^public import VectorValuedHarmonicAnalysis\.' VectorValuedHarmonicAnalysis.lean
          | sed 's/^public import //' | sort)
      - name: Audit axioms
        run: lake env lean scripts/Audit.lean
